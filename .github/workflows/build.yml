name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  engine-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Locate project
        shell: bash
        run: |
          if [ ! -f CMakeLists.txt ] && [ -f DaliME/CMakeLists.txt ]; then
            shopt -s dotglob; mv DaliME/* .; fi
          ls

      - name: Engine unit test
        run: g++ -std=c++17 -O2 tests/engine_test.cpp Source/Engine.cpp -o engine_test && ./engine_test

  build:
    needs: engine-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-14
            label: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Locate project
        shell: bash
        run: |
          if [ ! -f CMakeLists.txt ] && [ -f DaliME/CMakeLists.txt ]; then
            shopt -s dotglob; mv DaliME/* .; fi

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          else
            cmake -B build
          fi

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd "build/DaliME_artefacts/Release"
          codesign --force --deep -s - "VST3/DaliME.vst3"
          codesign --force --deep -s - "AU/DaliME.component"
          codesign --force --deep -s - "Standalone/DaliME.app"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: DaliME-${{ matrix.label }}
          path: |
            build/DaliME_artefacts/Release/VST3
            build/DaliME_artefacts/Release/AU
            build/DaliME_artefacts/Release/Standalone
          if-no-files-found: warn
